name: Android QA release build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run unit tests and compile Android tests
        run: |
          set -o pipefail
          mkdir -p build
          ./gradlew testDebugUnitTest assembleDebugAndroidTest --console=plain 2>&1 | tee build/ci-test-log.txt

      - name: Run Android lint
        run: ./gradlew lintDebug lintRelease --console=plain

      - name: Build QA APK with test signing
        run: ./gradlew assembleQaRelease --console=plain

      - name: Verify QA APK signature and package
        run: |
          apk=app/build/outputs/apk/qaRelease/app-qaRelease.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" |
            grep -F 'Signer #1 certificate SHA-256 digest: 61f0b1bb4485fcf4333e005e1adb43115340eb6b63b8f378cce5319430a4d012'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" |
            grep -F "package: name='com.prod.mpod.signingtest'"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            build/ci-test-log.txt
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: mpod-qa-test-signed-apk
          path: app/build/outputs/apk/qaRelease/app-qaRelease.apk
          if-no-files-found: error
