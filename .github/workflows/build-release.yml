name: Android release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run unit tests
        run: |
          ./gradlew testDebugUnitTest --console=plain --stacktrace --info || {
            echo "=== TEST RESULTS ==="
            find app/build/test-results -type f -name "*.xml" -exec cat {} + 2>/dev/null || true
            exit 1
          }

      - name: Assemble Android test APK
        run: ./gradlew assembleDebugAndroidTest --console=plain --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug lintRelease --console=plain --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mpod-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
