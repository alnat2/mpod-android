name: Android release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run unit tests and compile Android tests
        run: |
          ./gradlew testDebugUnitTest assembleDebugAndroidTest --console=plain > /tmp/test_log.txt 2>&1 || {
            git checkout -B ci-test-log
            cp /tmp/test_log.txt ./ci_test_log.txt
            find app/build/test-results -type f -name "*.xml" -exec cp {} ./ \; 2>/dev/null || true
            git config user.name "CI Log Bot"
            git config user.email "bot@ci.local"
            git add .
            git commit -m "CI Test Failure Log"
            git push -f origin ci-test-log || true
            cat /tmp/test_log.txt
            exit 1
          }

      - name: Run Android lint
        run: ./gradlew lintDebug lintRelease --console=plain

      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mpod-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
