name: Android release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JetBrains Runtime 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run unit tests
        run: |
          set -e
          ./gradlew testDebugUnitTest --console=plain --stacktrace > /tmp/build_log.txt 2>&1 || {
            echo "FAILED_COMPILE=true" >> $GITHUB_ENV
            git checkout -B ci-debug-log
            cp /tmp/build_log.txt ./ci_build_log.txt
            git config user.name "CI Log Bot"
            git config user.email "bot@ci.local"
            git add ci_build_log.txt
            git commit -m "CI Build Log"
            git push -f origin ci-debug-log || true
            cat /tmp/build_log.txt
            exit 1
          }

      - name: Assemble Android test APK
        run: ./gradlew assembleDebugAndroidTest --console=plain --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug lintRelease --console=plain --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mpod-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
